
<aside class="flex min-h-screen w-64 flex-col bg-[#142B3C] text-white">

  <!-- Logo -->
  <div class="flex h-20 items-center gap-3 border-b border-white/10 px-6">
    <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#31A47A] text-xl font-bold">
      N
    </div>

    <div>
      <h1 class="text-xl font-bold tracking-widest">NUVANTA</h1>
      <p class="text-[10px] tracking-[3px] text-gray-400">
        MANAGEMENT SYSTEM
      </p>
    </div>
  </div>

  <!-- Navigation -->
  <div class="px-4 py-6">

    <p class="mb-4 px-3 text-xs font-semibold uppercase tracking-widest text-gray-400">
      Main Menu
    </p>

    <nav class="space-y-1">

      @for (item of menuItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm text-gray-300 transition hover:bg-white/10 hover:text-white"
        >
          <span class="w-6 text-center text-lg">{{ item.icon }}</span>

          <span>{{ item.name }}</span>
        </a>
      }

    </nav>

  </div>

  <!-- Bottom -->
  <div class="mt-auto border-t border-white/10 p-5">
    <div class="flex items-center gap-3">
      <div class="flex h-9 w-9 items-center justify-center rounded-full bg-[#31A47A] font-bold">
        N
      </div>

      <div>
        <p class="text-sm font-semibold">Nourhan</p>
        <p class="text-xs text-gray-400">Administrator</p>
      </div>
    </div>
  </div>

</aside>
