<div class="flex min-h-screen bg-slate-50 font-sans">

  <!-- Desktop Sidebar -->
  <aside class="hidden md:block w-60 shrink-0 bg-slate-900 text-white p-4">

    <div class="text-2xl font-extrabold text-teal-400 mb-8 tracking-wide">
      NUVANTA
    </div>

    <p class="text-xs uppercase tracking-widest text-slate-500 mb-3 px-2">
      Main Menu
    </p>

    @for (l of links; track l.to) {
      <a
        [routerLink]="l.to"
        routerLinkActive="bg-teal-600 text-white shadow-lg shadow-teal-900/30"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 p-3 rounded-lg hover:bg-slate-700 mb-1 text-sm text-slate-300 transition-all duration-200">

        <span>{{ l.label }}</span>
      </a>
    }

    <div class="mt-10 border-t border-slate-700 pt-5">
      <p class="text-xs text-slate-500 px-2">
        NUVANTA © 2026
      </p>
    </div>

  </aside>


  <!-- Mobile Sidebar -->
  @if (open()) {
    <div class="fixed inset-0 z-50 flex md:hidden">

      <aside class="w-60 bg-slate-900 text-white p-4 shadow-2xl">

        <div class="flex items-center justify-between mb-8">
          <div class="text-2xl font-extrabold text-teal-400">
            NUVANTA
          </div>

          <button
            (click)="open.set(false)"
            class="text-slate-400 hover:text-white text-2xl">
            ×
          </button>
        </div>

        @for (l of links; track l.to) {
          <a
            [routerLink]="l.to"
            routerLinkActive="bg-teal-600 text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="open.set(false)"
            class="block p-3 rounded-lg hover:bg-slate-700 mb-1 text-sm text-slate-300 transition-all">

            {{ l.label }}
          </a>
        }

      </aside>

      <div
        class="flex-1 bg-black/50"
        (click)="open.set(false)">
      </div>

    </div>
  }


  <!-- Main Content -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Header -->
    <header class="flex items-center gap-3 bg-white px-4 md:px-6 py-4 shadow-sm border-b border-slate-100">

      <button
        class="md:hidden text-2xl text-slate-700 hover:text-teal-600"
        (click)="open.set(true)">
        ☰
      </button>

      <span class="font-bold text-slate-700">
        NUVANTA
      </span>

      <div class="ml-auto flex items-center gap-3">

        <button class="relative text-slate-500 hover:text-teal-600">
          <span class="text-xl">♧</span>
          <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>

        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center font-bold">
            N
          </div>

          <span class="hidden sm:block text-sm font-medium text-slate-600">
            Nourhan
          </span>
        </div>

      </div>

    </header>


    <!-- Page Content -->
    <main class="flex-1 p-4 md:p-6 lg:p-8">

      <router-outlet />

    </main>


    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 px-6 py-4">
      <p class="text-center text-xs text-slate-400">
        © 2026 NUVANTA. All rights reserved.
      </p>
    </footer>

  </div>

</div>
